services:
  cavalry-books-api:
    build:
      context: ./api-backend
    image: cavalry-books-api:local
    container_name: cavalry-books-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3000"
      PGHOST: cavalry-books-db
      PGPORT: "5432"
      PGPASSWORD: ${POSTGRES_PASSWORD}
      CATALOG_SOURCE_URL: https://script.google.com/macros/s/AKfycbx9xaPSdNyEa51Lws0iEBobfHrh4ZqAw4R5QO5YJi680D1B-S1HlRdrTxMi5QdXTccXEA/exec
      CORS_ORIGINS: https://cavalrypublishers.co.ke,https://api.cavalrypublishers.co.ke
      SYNC_INTERVAL_MS: "300000"
      ADMIN_READ_CACHE_TTL_MS: "120000"
      PAYMENT_SMS_CACHE_TTL_MS: "15000"
      PUBLIC_ORDER_STATUS_CACHE_TTL_MS: "30000"
    ports:
      - "127.0.0.1:3100:3000"
    networks:
      - cavalry-books-private
    depends_on:
      cavalry-books-db:
        condition: service_healthy
    mem_limit: 192m
    cpus: 0.50
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  cavalry-books-db:
    image: postgres:16-alpine
    container_name: cavalry-books-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_INITDB_ARGS: --data-checksums
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - cavalry-books-pgdata:/var/lib/postgresql/data
    networks:
      - cavalry-books-private
    mem_limit: 384m
    cpus: 0.50
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  cavalry-books-pgdata:
    name: cavalry-books-pgdata

networks:
  cavalry-books-private:
    name: cavalry-books-private
    driver: bridge
